    Research Interests:
      - My research focuses on LLM pre-training, agent policy learning, and generative AI. 
      - Specific topics include: 
        - "Deep learning optimization and generalization."
        - "Optimization for large-scale machine learning and LLM training."
        - "Efficient preconditioning and Muon-type optimizers."
        - "Parameter-efficient fine-tuning and deep learning applications."

    Experience:
      - organization: Pengcheng Laboratory
        location: Shenzhen, China
