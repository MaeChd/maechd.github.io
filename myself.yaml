        start_date: 2025-07
        end_date: present
        highlights:
          - "Conduct research on deep learning optimization, LLM training infrastructure, PEFT, and optimization theory."
          - "Work on large-scale training systems and optimizer design for modern deep learning models."

    Projects:
      - name: "Distributed Muon-based MoE Training on 64 NPUs"
        type: "Project - Systems for LLM Training"
        keywords:
          - MoE
          - Muon
          - ZeRO
          - Megatron
          - MindSpeed
          - 64 NPUs
        highlights:
          - "Built Muon and Distributed Muon in a Megatron- and MindSpeed-based 64-NPU MoE training framework."
          - "Supported TP, CP, EP, and PP parallelism."
          - "Observed that Muon consistently outperformed AdamW during training."
          - "Reduced memory usage with Distributed Muon, with additional communication overhead."
          - "Identified a loss-spike issue caused by the interaction between MoE experts and Muon redundancy."

